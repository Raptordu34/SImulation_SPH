<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation SPH - Fluide Réaliste 2D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-200 h-screen w-screen overflow-hidden font-sans select-none">

    <!-- Zone principale pour les Canvas -->
    <div class="relative h-full w-full bg-grid" id="canvas-container">
        <!-- Canvas WebGL2 pour le rendu fluide -->
        <canvas id="simCanvas" class="block w-full h-full"></canvas>
        <!-- Canvas 2D overlay pour UI (outils, curseur, obstacles) -->
        <canvas id="overlayCanvas" class="block w-full h-full absolute top-0 left-0 pointer-events-none"></canvas>

        <!-- Info overlay -->
        <div class="absolute top-4 right-4 pointer-events-none z-10">
            <p class="text-sm text-cyan-400 font-mono drop-shadow-md bg-slate-900/60 px-2 py-1 rounded" id="fps-counter">FPS: 60 | Particules: 0</p>
        </div>

        <!-- Hint Échap -->
        <div class="absolute bottom-4 right-4 pointer-events-none z-10">
            <p class="text-xs text-slate-500 font-mono">Échap — Options</p>
        </div>

        <!-- Titre -->
        <div class="absolute bottom-4 left-4 pointer-events-none z-10">
            <h1 class="text-2xl font-bold text-white/80 drop-shadow-lg">Fluide SPH</h1>
            <p class="text-xs text-slate-400">WebGL2</p>
        </div>

        <!-- Level-up overlay -->
        <div id="levelup-overlay" class="hidden absolute inset-0 z-50 flex items-center justify-center" style="background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);">
            <div class="text-center">
                <h2 id="levelup-title" class="text-4xl font-bold text-yellow-400 mb-2 drop-shadow-lg" style="text-shadow:0 0 20px rgba(250,204,21,0.4);">Niveau 2 !</h2>
                <p class="text-slate-300 mb-5 text-sm">Choisissez une am&eacute;lioration</p>
                <div id="levelup-choices" class="flex gap-3 justify-center flex-wrap"></div>
            </div>
        </div>

        <!-- Options Overlay (touche Échap) -->
        <div id="options-overlay" class="hidden absolute inset-0 z-40 flex items-center justify-center"
             style="background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);">
          <div id="options-panel"
               style="background:#1e293b;border:1px solid #334155;border-radius:16px;
                      padding:28px;min-width:380px;max-width:480px;max-height:90vh;
                      overflow-y:auto;color:#e2e8f0;box-shadow:0 24px 60px rgba(0,0,0,0.6);">

            <!-- En-tête -->
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
              <h2 style="font-size:1.2rem;font-weight:700;color:#fff;">Options</h2>
              <button id="options-close"
                      style="background:rgba(255,255,255,0.08);border:none;color:#94a3b8;
                             width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:1.1rem;">✕</button>
            </div>

            <!-- Section Physique -->
            <div class="options-section">
              <div class="options-section-title">Physique</div>
              <div class="options-row">
                <label class="options-label">Gravité</label>
                <input type="range" id="opt-gravity" min="-2000" max="3000" step="10" value="0" class="options-slider">
                <span class="options-value" id="opt-gravity-val">0</span>
              </div>
              <div class="options-row">
                <label class="options-label">Viscosité</label>
                <input type="range" id="opt-viscosity" min="0" max="1000" step="5" value="5" class="options-slider">
                <span class="options-value" id="opt-viscosity-val">5</span>
              </div>
              <div class="options-row">
                <label class="options-label">Tension surface</label>
                <input type="range" id="opt-surface" min="0" max="3000" step="50" value="1500" class="options-slider">
                <span class="options-value" id="opt-surface-val">1500</span>
              </div>
              <div class="options-row">
                <label class="options-label">Rigidité</label>
                <input type="range" id="opt-gasconst" min="500" max="20000" step="100" value="6000" class="options-slider">
                <span class="options-value" id="opt-gasconst-val">6000</span>
              </div>
              <div class="options-row">
                <label class="options-label">Anti-compression</label>
                <input type="range" id="opt-neargasconst" min="1000" max="30000" step="100" value="15000" class="options-slider">
                <span class="options-value" id="opt-neargasconst-val">15000</span>
              </div>
            </div>

            <!-- Section Rendu -->
            <div class="options-section">
              <div class="options-section-title">Rendu</div>
              <div class="options-row">
                <label class="options-label">Couleur eau</label>
                <input type="color" id="opt-watercolor" value="#06b6d4" class="options-color">
              </div>
              <div class="options-row">
                <label class="options-label">Couleur profonde</label>
                <input type="color" id="opt-deepcolor" value="#051859" class="options-color">
              </div>
              <div class="options-row">
                <label class="options-label">Taille particules</label>
                <input type="range" id="opt-particlesize" min="10" max="50" step="1" value="28" class="options-slider">
                <span class="options-value" id="opt-particlesize-val">28</span>
              </div>
              <div class="options-row">
                <label class="options-label">Bloom</label>
                <label class="options-toggle">
                  <input type="checkbox" id="opt-bloom" checked>
                  <span class="options-toggle-track"></span>
                </label>
              </div>
              <div class="options-row" id="opt-bloom-intensity-row">
                <label class="options-label">Intensité bloom</label>
                <input type="range" id="opt-bloom-intensity" min="0" max="2" step="0.05" value="0.4" class="options-slider">
                <span class="options-value" id="opt-bloom-intensity-val">0.4</span>
              </div>
              <div class="options-row">
                <label class="options-label">Caustiques</label>
                <label class="options-toggle">
                  <input type="checkbox" id="opt-caustics" checked>
                  <span class="options-toggle-track"></span>
                </label>
              </div>
              <div class="options-row">
                <label class="options-label">Mousse</label>
                <label class="options-toggle">
                  <input type="checkbox" id="opt-foam" checked>
                  <span class="options-toggle-track"></span>
                </label>
              </div>
            </div>

            <!-- Section Actions -->
            <div class="options-section">
              <div class="options-section-title">Actions</div>
              <button id="btn-add" class="options-btn options-btn-primary">Faire tomber de l'eau</button>
              <div style="display:flex;gap:8px;margin-top:8px;">
                <button id="btn-reset" class="options-btn options-btn-secondary">Vider</button>
                <button id="btn-record" class="options-btn options-btn-danger">Enregistrer</button>
                <button id="btn-screenshot" class="options-btn options-btn-secondary">Photo</button>
              </div>
            </div>

          </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
